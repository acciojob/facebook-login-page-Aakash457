<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left-section">
            <h1>facebook</h1>

            <p>
                Facebook helps you connect and share<br>
                with the people in your life.
            </p>
        </div>

        <!-- Login Section -->
        <div class="right-section">

            <div class="login-box">

                <form>

                    <input
                        type="text"
                        placeholder="Email address or phone number"
                    >

                    <input
                        type="password"
                        placeholder="Password"
                    >

                    <button class="login-btn" type="submit">
                        Log in
                    </button>

                </form>

                <a href="#" class="forgot">
                    Forgotten account?
                </a>

                <div class="line"></div>

                <button class="create-btn" onclick="location.href='register.html'">
                    Create new account
                </button>

            </div>

        </div>

    </div>

</body>
</html>
